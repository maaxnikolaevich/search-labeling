[project]
name = "rate-our-search"
version = "0.1.0"
description = "Service for search evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15.2",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.12",
    "gunicorn>=23.0.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.4",
    "python-keycloak>=5.5.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.40",
    "ujson>=5.10.0",
    "uvicorn>=0.34.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]
ignore = ["E203", "E501", "RUF001", "B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_no_return = false
warn_return_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.djlint]
profile="jinja"
max_line_length = 120

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "djlint>=1.36.4",
    "mypy>=1.16.0",
    "pre-commit>=4.2.0",
    "ruff>=0.11.8",
]
