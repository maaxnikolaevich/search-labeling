<div class="list-group-item p-4"
     id="{{ result.id }}"
     {% if result.position == 1 %}tabindex="-1"{% endif %}>
    <div class="d-flex flex-column flex-md-row gap-3">
        <!-- Product Image -->
        <div class="product-image-container">
            <img src="https://cdn-products.sdvor.com/images/sdvor-catalog/350x350/0/{{ result.product_code }}.jpg"
                 alt="{{ result.title }}"
                 class="product-image rounded"
                 onerror="src='https://www.sdvor.com/favicon.svg';">
        </div>
        <!-- Result Content -->
        <div class="result-content flex-grow-1">
            <h3 class="h5 mb-1">{{ result.title }}</h3>
            <div class="text-muted">{{ result.product_code }} | {{ result.category }}</div>
        </div>
        <!-- Action Buttons -->
        <div class="d-flex flex-md-column gap-2 action-buttons"
             hx-indicator="#spinner">
            <button class="btn btn-outline-success {% if result.is_relevant == True %}active{% endif %}"
                    hx-post="/results"
                    hx-vars='{"search_session_id": "{{ session.id }}", "search_result_id": "{{ result.id }}", "is_relevant": "true"}'
                    hx-ext='json-enc'
                    hx-target="closest .list-group-item"
                    hx-swap="outerHTML">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="icon"
                     width="24"
                     height="24"
                     viewBox="0 0 24 24"
                     stroke-width="2"
                     stroke="currentColor"
                     fill="none">
                    <path d="M7 11v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3a4 4 0 0 0 4-4V3a2 2 0 0 1 4 0v5h3a2 2 0 0 1 2 2l-1 5a2 3 0 0 1-2 2h-7a3 3 0 0 1-3-3" />
                </svg>
            </button>
            <button class="btn btn-outline-danger {% if result.is_relevant == False %}active{% endif %}"
                    hx-post="/results"
                    hx-vars='{"search_session_id": "{{ session.id }}", "search_result_id": "{{ result.id }}", "is_relevant": "false"}'
                    hx-ext='json-enc'
                    hx-target="closest .list-group-item"
                    hx-swap="outerHTML">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="icon"
                     width="24"
                     height="24"
                     viewBox="0 0 24 24"
                     stroke-width="2"
                     stroke="currentColor"
                     fill="none">
                    <path d="M7 13V5a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h3a4 4 0 0 1 4 4v1a2 2 0 0 0 4 0v-5h3a2 2 0 0 0 2-2l-1-5a2 3 0 0 0-2-2h-7a3 3 0 0 0-3 3" />
                </svg>
            </button>
        </div>
    </div>
</div>
